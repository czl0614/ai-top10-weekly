name: AI 应用周榜 TOP10

on:
  schedule:
    # 每周一 01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# 防止手动触发和定时任务撞车
concurrency:
  group: weekly-top10
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖与中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow

      - name: 抓取 npm / PyPI 下载量
        run: python scripts/fetch_metrics.py

      - name: 排序生成榜单数据
        run: python scripts/rank.py

      - name: 生成海报
        run: python scripts/generate.py

      - name: 提交结果到仓库
        run: |
          cp poster.png poster_latest.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poster_latest.png data/metrics.json data/ai_top10.json
          if git diff --staged --quiet; then
            echo "本周数据无变化，跳过提交"
          else
            git commit -m "chore: 更新周榜 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 推送 Bark
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_GROUP: ${{ vars.BARK_GROUP || 'AI周报' }}
          SITE_URL: https://github.com/${{ github.repository }}
        run: |
          # raw.githubusercontent.com 在国内经常连不通，Bark 拉不到图就只剩文字
          # 改用 jsdelivr，按 commit SHA 取图（SHA 不可变，不会命中旧缓存）
          SHA=$(git rev-parse HEAD)
          PRIMARY="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SHA}/poster_latest.png"
          MIRROR="https://ghfast.top/https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/poster_latest.png"

          export POSTER_URL="$PRIMARY"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$PRIMARY" || echo 000)
          echo "图床自检 jsdelivr: $code"
          if [ "$code" != "200" ]; then
            export POSTER_URL="$MIRROR"
            echo "回退镜像: $POSTER_URL"
          fi
          echo "最终海报地址: $POSTER_URL"

          sleep 5
          python scripts/push_bark.py
